# Runs R CMD check on every push and pull request (macOS and Linux).
# Result is shown as a green tick / red cross on GitHub and in the README badge.
name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: MetaboRewire
          extra-packages: any::rcmdcheck, bioc::limma
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: MetaboRewire
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'
